<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Users</title>

    <link rel="stylesheet" href="./css/styles.css">

</head>

<body>

    <header class="header-mobile">

        <h1>Restaurant App</h1>

    </header>

    <nav class="sidebar">

        <h2>Restaurant App</h2>

        <ul>

            <li>

                <a href="stock.html">

                    Stock

                </a>

            </li>

            <li>

                <a href="dishes.html">

                    Dishes

                </a>

            </li>

            <li>

                <a href="orders.html">

                    Orders

                </a>

            </li>

            <li class="active">

                <a href="users.html">

                    Users

                </a>

            </li>

            <li>

                <a
                    id="btn-logout"
                    href="#">

                    Logout

                </a>

            </li>

        </ul>

    </nav>

    <main class="container">

        <section class="users-section">

            <div class="section-header">

                <h2>Users</h2>

            </div>

            <div
                id="users-container"
                class="ingredients-grid">

            </div>

            <button
                id="btn-add-user"
                class="add-btn">

                + Add New User

            </button>

        </section>

    </main>

    <nav class="bottom-nav">

        <a href="stock.html">

            📦

            <span>Stock</span>

        </a>

        <a href="dishes.html">

            🍔

            <span>Dishes</span>

        </a>

        <a href="orders.html">

            📋

            <span>Orders</span>

        </a>

        <a href="users.html">

            👤

            <span>Users</span>

        </a>

        <a
            id="btn-logout-mobile"
            href="#">

            🚪

            <span>Logout</span>

        </a>

    </nav>

    <!-- Modal -->

    <div
        id="user-modal"
        class="modal">

        <div class="modal-content">

            <h2>Add User</h2>

            <input
                id="user-code"
                type="text"
                placeholder="Code">

            <input
                id="user-identification"
                type="text"
                placeholder="Identification">

            <input
                id="user-name"
                type="text"
                placeholder="Name">

            <input
                id="user-phone"
                type="text"
                placeholder="Phone">

            <input
                id="user-email"
                type="email"
                placeholder="Email">

            <select id="user-gender">

                <option value="">

                    Select Gender (Optional)

                </option>

                <option value="Female">

                    Female

                </option>

                <option value="Male">

                    Male

                </option>

            </select>

            <div class="modal-actions">

                <button id="btn-save">

                    Save

                </button>

                <button id="btn-cancel">

                    Cancel

                </button>

            </div>

        </div>

    </div>

    <script src="./js/users.js"></script>

</body>

</html>
