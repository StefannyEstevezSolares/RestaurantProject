<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Stock</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <header class="header-mobile">
        <button class="menu-btn">☰</button>
        <h1>Stock</h1>
    </header>

    <nav class="sidebar">
        <h2>Restaurant App</h2>

        <ul>
            <li>🏠 Home</li>
            <li>🍔 Dishes</li>
            <li class="active">📦 Stock</li>
            <li>📋 Orders</li>
        </ul>
    </nav>

    <main class="container">

        <section class="stock-section">

            <div class="section-header">
                <h2>Savory Food Ingredients</h2>
            </div>

            <div class="ingredients-grid">

                <article class="ingredient-card">

                    <div class="ingredient-image"></div>

                    <div class="ingredient-info">
                        <h3>Beef</h3>
                        <p>12 kg</p>
                    </div>

                    <div class="actions">
                        <button>−</button>
                        <button>+</button>
                        <button>🗑</button>
                    </div>

                </article>

                <article class="ingredient-card">

                    <div class="ingredient-image"></div>

                    <div class="ingredient-info">
                        <h3>Onion</h3>
                        <p>8 kg</p>
                    </div>

                    <div class="actions">
                        <button>−</button>
                        <button>+</button>
                        <button>🗑</button>
                    </div>

                </article>

            </div>

            <div class="section-header">
                <h2>Sweet Food Ingredients</h2>
            </div>

            <div class="ingredients-grid">

                <article class="ingredient-card">

                    <div class="ingredient-image"></div>

                    <div class="ingredient-info">
                        <h3>Chocolate</h3>
                        <p>15 bars</p>
                    </div>

                    <div class="actions">
                        <button>−</button>
                        <button>+</button>
                        <button>🗑</button>
                    </div>

                </article>

            </div>

            <button class="add-btn">
                + Add New Ingredient
            </button>

        </section>

    </main>

</body>
</html>
