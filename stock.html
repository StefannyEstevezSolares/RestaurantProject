<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

<header class="header-mobile">

</header>

    <nav class="sidebar">

        <ul>

            <li>

                </a>
        

            </li>

            <li>
                <a id="btn-logout" href="#"> Logout</a>
            </li>
            

        </ul>

    </nav>

    <main class="container">

        <section class="stock-section">

            <div class="section-header">
                <h2>Inventory</h2>
            </div>

            <div id="stock-container" class="ingredients-grid"></div>

            <button id="btn-add-ingredient" class="add-btn">
                + Add New Ingredient
            </button>

        </section>

    </main>

    <nav class="bottom-nav">
    <a href="stock.html">📦<span>Stock</span></a>
    <a href="dishes.html">🍔<span>Dishes</span></a>

    <!-- Modal -->

    <div id="ingredient-modal" class="modal">

        <div class="modal-content">

            <h2>Add Ingredient</h2>

            <input id="ingredient-code" type="text" placeholder="Code">
            <input id="ingredient-name" type="text" placeholder="Name">
            <input id="ingredient-description" type="text" placeholder="Description">
            <input id="ingredient-quantity" type="number" placeholder="Quantity">
            <input id="ingredient-unit" type="text" placeholder="Unit">
            <div class="modal-actions">

                <button id="btn-save">Save</button>
                <button id="btn-cancel">Cancel</button>

            </div>

        </div>
    </div>

    <script src="./js/stock.js"></script>

</body>
